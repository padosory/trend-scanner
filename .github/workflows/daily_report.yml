name: Daily Trend Scan

on:
  schedule:
    # 21:00 UTC = 06:00 KST. GitHub의 스케줄 실행은 부하에 따라 수십 분~수 시간
    # 밀린다(실측 최대 3.5시간). 09:00 KST 개장 전에 들어올 여유를 벌려고 30분 당겼다.
    - cron: "0 21 * * 1-5"
    # 백업 — 앞 실행이 아예 누락되거나 크게 밀렸을 때만 일한다. 이미 마지막
    # 거래일이 반영돼 있으면 --skip-if-current로 즉시 종료하므로, 정상일엔
    # 중복 스캔·중복 알림이 발생하지 않는다.
    - cron: "0 23 * * 1-5"     # 23:00 UTC = 08:00 KST (여전히 개장 전)
  workflow_dispatch:            # 수동 실행 가능

permissions:
  contents: write               # 소스 체크아웃 + 신호 히스토리 커밋
  pages: write                  # GitHub Pages 배포
  id-token: write               # OIDC 토큰 (Pages 배포 필수)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # 호출당 타임아웃과 별개로, 잡이 폭주해도 45분에 강제 종료
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # ── 소스 체크아웃 ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python 환경 ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── OHLCV parquet 캐시 ────────────────────────────────────────────────
      # 캐시 키에 run_id를 포함해 매 실행마다 새로 저장하고,
      # restore-keys로 직전 실행 캐시를 그대로 가져온다.
      - name: Cache OHLCV parquet
        uses: actions/cache@v4
        with:
          path: backtest/cache/
          key: ohlcv-${{ github.run_id }}
          restore-keys: ohlcv-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 스캔 실행 ────────────────────────────────────────────────────────
      - name: Run daily scan
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FINNHUB_API_KEY:     ${{ secrets.FINNHUB_API_KEY }}
          ECOS_API_KEY:        ${{ secrets.ECOS_API_KEY }}
          # GitHub Pages URL: username.github.io/repo-name (Telegram 리포트 링크로 사용)
          GITHUB_PAGES_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        # 백업 스케줄(23:00 UTC)은 앞 실행이 실패·누락됐을 때만 실제로 스캔한다.
        # 스캔 기준일이 마지막 거래일에 못 미치면 이 스텝이 exit 1로 끝나고,
        # 아래 Pages 배포가 건너뛰어져 낡은 리포트가 최신인 척 재발행되지 않는다.
        run: python run_daily_report.py ${{ github.event.schedule == '0 23 * * 1-5' && '--skip-if-current' || '' }}

      # ── 신호 히스토리 지속(repo 커밋) ────────────────────────────────────
      # 매 러너는 상태가 없으므로, 갱신된 히스토리 JSON을 repo에 커밋해 다음
      # 실행이 이어받게 한다. [skip ci]로 배포 워크플로 재트리거를 방지.
      - name: Persist signal history
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: 신호 히스토리·시장 상태 업데이트 [skip ci]"
            # 원격이 앞서 있으면(동시 실행·수동 push 등) 그냥 push는 거부되므로,
            # data/ 커밋을 원격 위로 rebase한 뒤 push한다. 충돌 시 최대 3회 재시도.
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && break
              echo "push 재시도 $i..."
              sleep 3
            done
          else
            echo "데이터 변경 없음 — 커밋 스킵"
          fi

      # ── 리포트 다운로드용 아티팩트 (오프라인 백업) ────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      # ── GitHub Pages 배포 (public repo — 폰에서 리포트 열람용) ─────────────
      # Settings → Pages → Source 를 "GitHub Actions"로 설정해야 한다.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
