name: Daily Trend Scan

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 06:30 KST, 월~금
  workflow_dispatch:            # 수동 실행 가능

permissions:
  contents: read                # 소스 체크아웃(private repo에서 필수)

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ── 소스 체크아웃 ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python 환경 ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # ── OHLCV parquet 캐시 ────────────────────────────────────────────────
      # 캐시 키에 run_id를 포함해 매 실행마다 새로 저장하고,
      # restore-keys로 직전 실행 캐시를 그대로 가져온다.
      - name: Cache OHLCV parquet
        uses: actions/cache@v4
        with:
          path: backtest/cache/
          key: ohlcv-${{ github.run_id }}
          restore-keys: ohlcv-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 스캔 실행 ────────────────────────────────────────────────────────
      - name: Run daily scan
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
        run: python run_daily_report.py

      # ── 리포트를 아티팩트로 업로드 (로컬 다운로드용) ──────────────────────
      # private repo라 GitHub Pages 발행은 안 함(무료 플랜 제약).
      # 실행 페이지 하단 Artifacts에서 reports/ 를 zip으로 받아 로컬에서 연다.
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/
          retention-days: 30
          if-no-files-found: warn
